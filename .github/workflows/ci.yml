name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Demonstrate review exit codes
        shell: bash
        run: |
          python review.py examples/safe.json --output reports/safe
          set +e
          python review.py examples/risky.json --output reports/risky
          risky=$?
          python review.py examples/unknown.json --output reports/unknown
          unknown=$?
          set -e
          test "$risky" -eq 1
          test "$unknown" -eq 1
          python -c "import json; r=json.load(open('reports/risky/report.json')); assert {f['rule'] for f in r['findings']} == {'REPLACEMENT','ENCRYPTION_DISABLED','PUBLIC_ADMIN'}"
