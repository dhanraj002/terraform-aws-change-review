name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Demonstrate review exit codes
        shell: bash
        run: |
          python review.py examples/safe.json --output reports/safe
          set +e
          python review.py examples/risky.json --output reports/risky
          risky=$?
          python review.py examples/unknown.json --output reports/unknown
          unknown=$?
          set -e
          test "$risky" -eq 1
          test "$unknown" -eq 1
          python -c "import json; r=json.load(open('reports/risky/report.json')); assert {f['rule'] for f in r['findings']} == {'REPLACEMENT','ENCRYPTION_DISABLED','PUBLIC_ADMIN'}"
